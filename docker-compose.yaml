services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sre-grocery-store-api
    restart: always
    depends_on:
      - db
      - rabbitmq
      - jaeger
      - fluent-bit
      - redis
    ports:
      - "${WEB_PORT:-8000}:8000"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      PYTHONPATH: ${PYTHONPATH}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL}
      OTEL_TRACES_SAMPLER: ${OTEL_TRACES_SAMPLER}
      OTEL_PROPAGATORS: "tracecontext,baggage"
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      ENVIRONMENT: ${ENVIRONMENT}
    logging:
      driver: "fluentd"
      options:
        fluentd-address: "localhost:24224"
        tag: "docker.{{.Name}}"
        fluentd-async: "true"
    networks:
      - sre-grocery-store-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sre-grocery-store-worker
    command: ["celery", "-A", "api.worker", "worker", "--loglevel=info"]
    restart: always
    depends_on:
      - rabbitmq
      - db
      - pushgateway
      - jaeger
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      PROMETHEUS_PUSHGATEWAY: ${PROMETHEUS_PUSHGATEWAY}
      PYTHONPATH: ${PYTHONPATH}
      OTEL_SERVICE_NAME: sre-grocery-store-worker
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      ENVIRONMENT: ${ENVIRONMENT}
    networks:
      - sre-grocery-store-net

  db:
    image: postgres:15
    container_name: sre-grocery-store-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sre-grocery-store-net

  rabbitmq:
    image: "rabbitmq:3-management"
    container_name: sre-grocery-store-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - sre-grocery-store-net

  prometheus:
    image: prom/prometheus:latest
    container_name: sre-grocery-store-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./config/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml
      - ./config/monitoring/sli_rules.yml:/etc/prometheus/sli_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}'
    networks:
      - sre-grocery-store-net

  pushgateway:
    image: prom/pushgateway:latest
    container_name: sre-grocery-store-pushgateway
    restart: always
    ports:
      - "9091:9091"
    networks:
      - sre-grocery-store-net

  grafana:
    image: grafana/grafana:11.5.1
    container_name: sre-grocery-store-grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/monitoring/grafana-provisioning:/etc/grafana/provisioning
    networks:
      - sre-grocery-store-net
    depends_on:
      - prometheus
      - loki

  alertmanager:
    image: prom/alertmanager:latest
    container_name: sre-grocery-store-alertmanager
    restart: always
    ports:
      - "9093:9093"
    volumes:
      - ./config/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - sre-grocery-store-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    container_name: sre-grocery-store-blackbox-exporter
    restart: always
    ports:
      - "9115:9115"
    volumes:
      - ./config/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml
    networks:
      - sre-grocery-store-net

  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: sre-grocery-store-jaeger
    ports:
      - "16686:16686"  # UI
      - "14268:14268"  # HTTP thrift collector
      - "14250:14250"  # gRPC collector
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
    networks:
      - sre-grocery-store-net

  loki:
    image: grafana/loki:2.8.0
    container_name: sre-grocery-store-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/monitoring/logging/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
      - loki_wal:/tmp/wal
    command: -config.file=/etc/loki/local-config.yaml
    user: "0"
    networks:
      - sre-grocery-store-net

  fluent-bit:
    image: fluent/fluent-bit:1.9
    container_name: sre-grocery-store-fluent-bit
    volumes:
      - ./config/monitoring/logging/fluent-bit-config.yaml:/fluent-bit/etc/fluent-bit.conf
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "24224:24224"
      - "24224:24224/udp"
    depends_on:
      - loki
    networks:
      - sre-grocery-store-net
    user: "0"

  redis:
    image: redis:7-alpine
    container_name: sre-grocery-store-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/var/lib/redisdata
    networks:
      - sre-grocery-store-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.89.0
    container_name: sre-grocery-store-redis-exporter
    restart: always
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      - redis
    networks:
      - sre-grocery-store-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.0
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    privileged: true
    devices:
      - "/dev/kmsg:/dev/kmsg"
    networks:
      - sre-grocery-store-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.18.1
    container_name: postgres-exporter
    environment:
      DATA_SOURCE_URI: "db:5432/postgres?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    ports:
      - "9187:9187"
    depends_on:
      - db
    networks:
      - sre-grocery-store-net


networks:
  sre-grocery-store-net:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  loki_data:
  loki_wal:
  redis_data:

