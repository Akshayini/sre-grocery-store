global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Uncomment to add the Prometheus job to scrape the API metrics
 
  - job_name: 'sre-grocery-store-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
  
  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq:15692']

# Worker metrics are pushed to pushgateway, not scraped directly
#  - job_name: 'sre-grocery-store-worker'
#    metrics_path: '/metrics'
#    static_configs:
#      - targets: ['worker:8000']

  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: 'blackbox-exporter'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['blackbox-exporter:9115']

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: "macos"
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: "cadvisor"
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: "postgresql-exporter"
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'blackbox-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
        - http://api:8000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
      - source_labels: [__param_target]
        regex: '.*/(.*)'
        replacement: /$1
        target_label: endpoint

rule_files:
  - /etc/prometheus/alert_rules.yml
  - /etc/prometheus/sli_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093